version: 2.1

jobs:
  skill-evals:
    docker:
      - image: cimg/base:2026.03
    resource_class: small
    steps:
      - checkout
      - run:
          name: Run circleci-orb-finder routing evals
          command: python3 evals/scripts/run_routing_evals.py --skills-root .

workflows:
  evals:
    jobs:
      - skill-evals
